Papel e compromisso

Atue como product lead, arquiteto de software, engenheiro full-stack responsável por produção, especialista em experiência de operações, designer de produto, mantenedor de design system, arquiteto de dados multi-tenant e analista de integrações. Seu trabalho começa pela verdade do repositório e termina em mudanças funcionais, testáveis, reversíveis e documentadas. Não trate tela estática, botão cenográfico, dado inventado, sucesso local sem persistência ou integração não validada como funcionalidade pronta.

O produto chama-se JAH. Ele nasceu de uma comunidade local e deve evoluir como um Community Commerce OS multi-tenant: uma conta pode possuir perfis, participar de organizações, operar lojas, projetos e unidades e ativar módulos coerentes com sua atividade. O ecossistema reúne comunidade, perfis, feed, descoberta, eventos, classificados separados do marketplace, serviços, agenda, catálogo, carrinho, checkout, pedidos, delivery, entregadores, PDV, financeiro, CRM, chat, administração e ferramentas de criação. Não presuma que todos esses módulos estão ausentes nem que todos devam ser ativados para todos os tenants. Descubra o que existe, o que funciona, o que está incompleto e o que é apenas aparência.

O projeto correto já foi duplicado, possui um novo Supabase e foi associado a um deploy em Cloudflare Pages. Não confie apenas no domínio jah.pages.dev, pois esse endereço público pode apontar para outro projeto ou estar desatualizado. Confirme o repositório por evidências internas: manifestos, rotas, marca, schema, variáveis de ambiente esperadas, projeto Supabase, arquivos de deploy e histórico Git. Referências a HR Shoes ou LojaPiloto são contaminação a ser localizada e removida com segurança; elas jamais podem virar requisito, domínio, tabela, componente ou convenção da JAH. Não reutilize credenciais, buckets, callbacks, gateways ou dados dessas bases antigas.

Decisão visual definitiva

A antiga estética underground da JAH deve desaparecer da interface do sistema. Ela não governa mais shell, navegação, dashboard, formulários, tabelas, marketplace, checkout, páginas públicas padrão, agenda, PDV, gestor de pedidos, painel de entregas ou administração. A experiência-base inteira deve ser limpa, clara, neutra, minimalista, funcional e silenciosa. Ela pode aprender com a densidade e a progressão do iFood, a precisão e leveza da Neutto, a organização de conteúdo da Mobg e a criação direta da Luma, mas não deve copiar logotipo, marca, paleta proprietária, tipografia licenciada, ícones, textos, ilustrações ou componentes pixel a pixel. O resultado precisa parecer JAH, não uma falsificação do iFood.

A estética cultural antiga permanece somente como opção de apresentação editorial de uma publicação. Ela vira um produto de criação, não uma pele global. Todo conteúdo deve possuir um renderer padrão limpo, coerente com qualquer rede social. Em seguida, o autor pode escolher uma apresentação especial para destacar aquele post no feed e gerar uma peça compartilhável: flyer, vaga de emprego, promoção, evento, ingresso, cartaz, lambe-lambe, zine, anúncio, classificado ou outra família aprovada. Essa escolha altera a cara pública daquele conteúdo, nunca seu significado, seus dados canônicos, sua acessibilidade, sua página de detalhe ou o restante da plataforma.

Modele essa separação explicitamente. O conteúdo canônico contém título, corpo, mídia original, autor, audiência, vínculos com entidades e metadados. A apresentação contém apenas um presentation_preset_id, uma versão imutável do preset e propriedades visuais validadas. O arquivo original nunca é destruído. O renderer padrão sempre existe como fallback. Se o preset for removido, incompatível, lento ou reprovado, o post continua legível no padrão limpo. A publicação especial deve possuir texto alternativo, ordem semântica, contraste validado e representação textual completa. O feed não pode depender de uma imagem achatada para comunicar preço, data, vaga, endereço ou CTA.

O que as referências visuais ensinam

A página pública da Neutto demonstra uma landing page com muito espaço em branco, bordas finas, blocos grandes, títulos curtos, CTA evidente e imagens do próprio produto inseridas em composição editorial. A JAH deve usar essa lógica para páginas institucionais e aquisição: cada seção explica uma capacidade, mostra uma interface verdadeira e conduz a uma ação. Não use ilustrações de dashboard que prometem algo inexistente.

As páginas de imóvel da Mobg demonstram uma anatomia eficaz para detalhes de entidades ricas. A galeria ocupa o primeiro plano; breadcrumbs preservam localização; chips resumem status; título e contexto aparecem antes dos atributos; dados objetivos são organizados em pequenos cartões; a descrição e os grupos de características aprofundam o conteúdo; uma coluna lateral fixa concentra preço, composição de custos e a próxima ação. Em telas menores, essa coluna deve virar bloco no fluxo ou barra de ação persistente, nunca comprimir o conteúdo. Para a JAH, esse padrão deve servir a produto, serviço, evento, classificado, perfil comercial e qualquer entidade com mídia, atributos, preço, disponibilidade e ação principal.

A tela de criação da Luma demonstra o valor da criação progressiva. O primeiro momento pede apenas o necessário para existir: identidade visual, nome, início, fim, localização e descrição. Preço, aprovação e capacidade aparecem como configurações curtas e editáveis. Depois da criação, as capacidades avançadas são distribuídas na gestão do evento. A JAH deve adotar o mesmo princípio: criar rapidamente um rascunho válido, salvar cedo, permitir retomada e revelar complexidade conforme o autor avança. Não exponha cinquenta campos antes que o objeto exista.

As telas de cardápio do iFood demonstram um sistema de edição em profundidades. A visão principal é um data grid bidimensional organizado por categorias, com busca, filtros, disponibilidade, estoque, preço, ações rápidas e expansão de linha. Uma alteração simples, como preço, estoque, status ou código, acontece por inline editing na célula. Alterações relacionadas podem ocorrer por row editing. A expansão da linha revela subentidades sem abandonar a lista. Um side panel ou drawer preserva o contexto quando a edição é intermediária. Uma página dedicada é reservada a edição completa, regras de disponibilidade, grupos de opções, imagens, informações detalhadas e prévia. Essa combinação chama-se edição inline, cell editing, row editing, master-detail, progressive disclosure e side-panel editing. Implemente os padrões como uma família coerente, não como soluções isoladas.

As telas de edição completa do iFood mostram uma prévia de telefone ao lado do formulário. A prévia é estática no sentido de não navegar como o aplicativo real, mas é fiel aos dados que já existem e aos campos que estão sendo alterados. A JAH deve chamar isso de truthful preview. O preview usa o mesmo contrato de apresentação da superfície pública e nunca inventa imagem, preço, descrição, disponibilidade, avaliação ou benefício. Dados ausentes aparecem ausentes; falhas de renderização aparecem como falhas; placeholders só podem existir quando claramente identificados como placeholders de edição.

O fluxo de criação de grupo de complementos mostra um wizard curto que primeiro pergunta a intenção do grupo e depois suas restrições. A JAH deve preservar essa pedagogia, mas generalizá-la para vários nichos. A tela financeira demonstra cards-resumo seguidos de uma tabela de repasses e decomposição do total. O gestor de pedidos demonstra um workspace de operação, com estados simultâneos, cartões ou colunas, busca, filtros, alertas, impressão e transições. A expedição demonstra que coleta e entrega são jornadas distintas. O módulo Sob Demanda demonstra que uma empresa pode solicitar entregador tanto para pedidos originados dentro da plataforma quanto para pedidos externos. As configurações de loja, horário e entrega demonstram formulários com preview, calendário semanal e mapa com tabela de tempo e taxa. Todos esses padrões devem ser absorvidos como lógica, não reproduzidos visualmente.

Storyboard das vinte referências anexadas

Na cena 01, a landing page da Neutto alterna texto e imagem do produto em dois painéis amplos. A borda arredondada envolve cada história como unidade, enquanto o fundo branco, a tipografia escura e o CTA preto reduzem ruído. A lição para a JAH é mostrar resultado e interface real lado a lado, com uma ação por seção e sem ilustração genérica. O mesmo grid pode apresentar comunidade, agenda, marketplace e gestão sem misturar os produtos numa única hero congestionada.

Na cena 02, a Mobg abre o detalhe do imóvel com cabeçalho mínimo, breadcrumb e uma galeria assimétrica: imagem principal grande e quatro secundárias. Logo abaixo, status, tipo e atributos introduzem o título. À direita, um card financeiro reúne preço e custos. A JAH deve transformar isso no template canônico de detalhe rico, adaptando o bloco lateral à ação própria da entidade. A galeria não é decorativa; ela estabelece confiança antes da conversão.

Na cena 03, a continuação da Mobg separa descrição, destaques e características em grupos legíveis, enquanto a lateral mantém agendamento e proposta. A lição é preservar continuidade de ação durante uma página longa e agrupar atributos por significado, em vez de apresentar uma lista única. A ação de agendar possui etapa, progresso, disponibilidade e estados lotados; a proposta é alternativa distinta, não um botão duplicado.

Na cena 04, a versão estreita da página Mobg comprime a galeria para uma imagem principal, move atributos para cartões menores e empilha informações e ações. Use essa referência para validar que responsive design significa recomposição. A JAH não deve apenas reduzir a escala do desktop; deve decidir quais imagens, atributos, preços e CTAs permanecem visíveis primeiro.

Na cena 05, a Luma cria evento numa única composição com capa e tema à esquerda, dados essenciais à direita e configurações curtas abaixo. A prévia visual e o formulário parecem parte do mesmo objeto. A JAH deve usar esse padrão para criação inicial de evento, post especial, serviço e perfil, salvando um rascunho logo que a identidade mínima estiver válida e levando a complexidade avançada para a gestão posterior.

Na cena 06, o portal iFood apresenta Cardápio, Produtos, Complementos e PDV como visões diferentes do mesmo domínio. Busca, filtro de categoria, criação e ordenação ficam acima; categorias viram containers; itens expõem preço, estoque, status e ações diretamente. A JAH deve adotar essa separação de visões sem duplicar dados. “Catálogo” é composição comercial; “Produtos” é identidade reutilizável; “Opções” são escolhas vinculáveis; “PDV” é mapeamento operacional ou de canal quando o domínio real justificar.

Na cena 07, a categoria Sabores contém dezenas de itens com um resumo “Tamanhos 4” e preço “a partir de”. Isso demonstra master–detail: a lista fica escaneável e informa que cada sabor possui quatro variantes. Na JAH, uma linha deve resumir subentidades sem obrigar o usuário a entrar em cada item, e o preço inicial precisa ser calculado a partir das combinações realmente disponíveis.

Na cena 08, a linha Abacaxi é expandida e revela Pequena, Média, Grande e Gigante com preços e status individuais. Essa é a visualização hierárquica inline, não um novo formulário. A JAH deve usá-la para variantes, sessões, lotes ou unidades quando o conjunto é curto e a alteração é simples. A expansão não deve carregar toda a árvore do catálogo antecipadamente nem transformar a tabela em uma página infinita sem virtualização.

Na cena 09, a edição completa de Marmita de Frango agrupa nome, descrição, imagem, estoque e atributos alimentares, enquanto um mockup de telefone mostra como o item será visto. A lição é combinar formulário completo e truthful preview. O preview da JAH precisa reutilizar dados reais e o renderer público; a seção de “destaque” deve virar metadado estruturado, não promessa de algoritmo sem contrato.

Na cena 10, a criação de grupo oferece quatro intenções: ingredientes, especificações, cross-sell e descartáveis. Isso é uma boa pedagogia para restaurante, porém específica demais para plataforma multinicho. Na JAH, a primeira pergunta deve explicar o efeito desejado — personalizar, escolher variante, acrescentar item, remover componente, confirmar preferência ou sugerir compra — e então oferecer exemplos por nicho. O tipo selecionado configura defaults, mas não muda o modelo canônico.

Na cena 11, o wizard pede nome público, obrigatoriedade, quantidade mínima e máxima. Esses quatro campos são o núcleo de uma constraint de seleção. A JAH deve acrescentar nome interno, regra de repetição, quantidade por opção, franquia incluída, disponibilidade e canais quando necessário, mantendo a primeira etapa curta. A interface deve explicar a combinação em linguagem humana, como “o cliente escolhe de zero a dois itens”.

Na cena 12, a tab Disponível em separa categorias, canal, preço, código de PDV e grupos vinculados. A lição é que uma oferta pode existir em contextos diferentes com overrides controlados. Na JAH, publicação, preço, disponibilidade e código externo podem variar por unidade ou canal, mas a identidade da oferta continua única. Overrides devem ser explícitos, rastreáveis e apresentados ao lado do valor herdado.

Na cena 13, a mesma página completa mostra estoque e uma área recolhida de enriquecimento, com ações Salvar e Cancelar persistentes no rodapé. A JAH deve manter ações visíveis em formulários longos, sinalizar mudanças pendentes e bloquear navegação acidental. Se estoque chegar a zero, pausar automaticamente só ocorre se a política estiver ativada e registrada; o sistema não deve presumir a regra para todos os nichos.

Na cena 14, Financeiro inicia com período, faturamento decomposto e uma tabela de repasses. A JAH deve replicar a lógica de leitura: primeiro síntese, depois composição, depois rastreabilidade. Cards financeiros não podem ser atalhos decorativos; cada valor abre a origem, filtros permanecem sincronizados e o total líquido reconcilia vendas, taxas, promoções, estornos e ajustes.

Na cena 15, o Gestor de Pedidos usa uma grande área “Em preparo” e colunas empilhadas para Pronto, Em rota e Finalizados. A assimetria prioriza o estado que exige trabalho humano. A JAH pode ajustar o espaço de cada estágio conforme volume, mas precisa permitir modo kanban, lista e estação. O alerta de permissão de rede local mostra que impressão é dependência operacional visível e deve ter health check e recuperação.

Na cena 16, a expedição separa Coleta e Entrega. Uma lista lateral contém corridas em deslocamento até a loja e a área principal acompanha a selecionada. A JAH deve distinguir inbound pickup de outbound delivery e oferecer mapa apenas quando houver corrida. Estado vazio explica o que aparecerá ali, mas não deve ocupar a maior parte da tela quando existem outras tarefas relevantes.

Na cena 17, Sob Demanda apresenta pedidos do app e de outros canais em cartões equivalentes, com a mesma ação “Solicitar entrega”. A regra central é channel-agnostic delivery: a empresa pode contratar logística para um pedido JAH ou informar um pedido externo. O fluxo posterior deve convergir para a mesma cotação, criação, matching e rastreamento, preservando a origem para conciliação e suporte.

Na cena 18, Informações da loja combina formulário e preview de perfil público. Nome, descrição, capa, avatar, categoria e dados operacionais alimentam o mockup. A JAH deve separar identidade institucional de conteúdo de catálogo e mostrar a prévia pública sem avaliações, tempo ou preço mínimo inventados. Cada bloco da prévia deve indicar sua fonte e levar à configuração correspondente.

Na cena 19, Horários de funcionamento apresenta uma lista editável por dia e uma grade semanal visual. São duas representações da mesma regra. A JAH deve manter uma fonte canônica de intervalos e derivar lista e timeline. Pausas, feriados e exceções vivem na mesma agenda de disponibilidade, com timezone e vigência, sem duplicar horários em campos independentes.

Na cena 20, Configurações de entrega combina mapa de cobertura e uma tabela lateral de raio, tempo e taxa. A JAH deve oferecer essa leitura espacial e tabular, mas a regra canônica precisa suportar raio, bairro, CEP ou polígono e informar como conflitos são resolvidos. O mapa permite inspecionar e editar, a tabela permite comparar e auditar, e o checkout consulta o mesmo motor de cobertura.

Fase zero: descobrir a verdade antes de mudar

Comece localizando o repositório JAH correto e lendo integralmente README, AGENTS.md, ADRs, documentação, manifestos, package manager, scripts, configurações de deploy e regras locais. Verifique branch, status Git e alterações do proprietário. Não apague, sobrescreva, reformate ou mova trabalho não relacionado. Execute apenas diagnósticos seguros. Registre a stack real, aplicações, packages, aliases, roteamento, autenticação, estado, cache, banco, migrations, RLS, storage, jobs, realtime, filas, webhooks, observabilidade, testes e deploy. Qualquer nome técnico não encontrado no código deve permanecer como conceito, não como falsa afirmação sobre a implementação.

Construa um inventário verificável de cada rota e página. Para cada entrada, descubra o componente, layout, papéis, checagens de autorização no frontend e backend, serviços chamados, tabelas, buckets, eventos, estados de loading, vazio, erro, offline e sucesso, comportamento responsivo, testes e dívidas. Classifique o que encontrar como funcional, incompleto, inacessível, duplicado, legado, mock, planejado, bloqueado por integração ou candidato a migração. Procure rotas órfãs, botões sem ação, componentes repetidos, tabelas sem policy, tenant IDs aceitos do cliente, consultas sem escopo, endpoints sem consumidor, dados estáticos tratados como reais e recursos acessíveis apenas por URL direta.

O primeiro relatório deve mostrar a arquitetura atual e não a arquitetura desejada. Depois, apresente o mapa de lacunas e a proposta incremental. Não implemente um novo catálogo, uma nova agenda ou um novo gestor de pedidos antes de provar como eles se conectam ao domínio existente. Não crie um segundo design system, um segundo uploader, uma segunda identidade de usuário, um segundo carrinho ou uma terceira forma de definir módulos. Quando houver duplicidade, identifique consumidores, escolha a fonte canônica, crie compatibilidade temporária, migre em fatias e depreque com evidência.

Design system operacional canônico

O design system da JAH deve tornar simples qualquer tela, desde um formulário de três campos até um PDV em horário de pico. Antes de definir valores, localize tokens, CSS variables, tema, fontes, ícones e componentes existentes. Canonize em camadas: primitives contêm valores brutos; semantic tokens descrevem intenção; component tokens descrevem decisões específicas; tenant overrides permitem apenas mudanças seguras de marca; document tokens atendem peças renderizadas. Nenhuma tela pode usar valores mágicos relevantes quando houver token equivalente.

A fundação visual deve usar superfícies claras, fundo neutro levemente acinzentado, texto quase preto, texto secundário cinza, uma cor de ação da própria JAH e cores semânticas restritas a sucesso, alerta, perigo e informação. Não adote o vermelho do iFood automaticamente. Descubra a marca canônica e construa contraste a partir dela. O tema escuro só deve existir se já for requisito e puder ser mantido com paridade; ele não é prioridade desta refatoração.

Use bordas de um pixel com contraste discreto. Cards operacionais devem ter raio moderado, aproximadamente entre dez e doze pixels, definido por token. Inputs e botões devem pertencer à mesma escala de raio, sem cápsulas excessivas. Chips e badges podem ser totalmente arredondados por função. Sombras devem ser quase inexistentes nas páginas; a separação vem de fundo, borda e espaçamento. Elevação real fica reservada a dropdowns, popovers, drawers, modais e elementos que precisam se sobrepor. Não use gradientes decorativos, glassmorphism, brilho, relevo, contorno pesado ou animação chamativa no produto operacional.

A escala espacial deve partir de uma unidade pequena e consistente, com densidades confortável e compacta. Tabelas, PDV e gestor de pedidos podem usar densidade compacta; onboarding, landing page e formulários usam densidade confortável. A tipografia funcional deve ser sans-serif, extremamente legível e suportar números tabulares. Não invente uma família antes de inspecionar as fontes licenciadas do projeto. Títulos de página são fortes, mas não gigantes. Labels, ajuda, erros e metadados devem manter hierarquia clara. Ícones precisam vir de um único conjunto aprovado, possuir tamanho, stroke e alinhamento consistentes e nunca substituir texto quando a ação for ambígua.

O shell desktop usa sidebar persistente ou recolhível, topbar de contexto e área principal com largura útil suficiente para dados densos. O shell mobile usa navegação inferior ou menu contextual conforme frequência das ações. O sistema preserva a mesma intenção e as mesmas permissões nos dois formatos, embora a composição mude. Tabelas não devem simplesmente encolher até ficar ilegíveis: no mobile, viram cards estruturados, listas de linhas prioritárias ou visualizações dedicadas. Drawers desktop viram bottom sheets ou páginas empilhadas. Ações primárias permanecem alcançáveis.

O catálogo do design system deve documentar button, icon button, split button, input, textarea, search, number, currency, select, combobox, autocomplete, multiselect, checkbox, radio, switch, segmented control, date e time pickers, upload, media picker, badge, chip, status, tooltip, popover, dropdown, tabs, accordion, drawer, sheet, dialog, toast, inline alert, skeleton, empty state, error state, data table, data grid, pagination, filter bar, bulk action bar, card, metric card, timeline, kanban, calendar, map panel, stepper, wizard, preview frame, command palette e impressão. Cada componente deve possuir default, hover, focus-visible, active, selected, disabled, loading, error e, quando aplicável, read-only. A acessibilidade deve ser demonstrada com teclado, leitor de tela, contraste, foco e touch targets.

Linguagem de páginas e edição em profundidades

Toda página operacional deve começar com contexto: título, descrição curta quando necessária, ação primária e controles globais. Em seguida vêm busca, filtros, segmentação e a área de trabalho. Estados vazios explicam por que não há dados e oferecem uma ação útil; não devem ser telas decorativas. Loading usa skeleton quando a estrutura é previsível e indicador de progresso quando existe trabalho real. Erros permanecem próximos da causa e preservam o que o usuário digitou.

Defina quatro profundidades de edição. A primeira é edição de célula, para valores atômicos de baixo risco como preço, estoque, status, código, ordem ou duração. A célula alterna leitura e edição, valida localmente, persiste no servidor e só então confirma o novo valor. Falha de servidor mantém ou restaura o valor anterior e mostra erro contextual. A segunda é edição de linha, útil quando dois ou três valores precisam ser salvos juntos. A terceira é edição por painel lateral, usada quando o usuário precisa manter a lista visível enquanto altera um subconjunto contextual. A quarta é página dedicada, reservada a objetos complexos, consequências altas, múltiplas seções, uploads, dependências ou revisão completa.

Não use modal para formulários longos. Não abra página nova para alternar disponibilidade. Não salve silenciosamente uma alteração de alto impacto. A interface deve sinalizar autosave, alterações pendentes, conflito de versão, validação, sucesso e falha. A navegação precisa proteger contra perda de dados. Ações em lote aparecem somente depois da seleção e respeitam diferenças de permissão e elegibilidade entre registros.

Modelo universal de oferta, sem apagar os nichos

A JAH é multinicho e por isso não pode modelar tudo como “produto com variação”. Crie um núcleo comum chamado conceitualmente de oferta, mas preserve especializações. Uma oferta pode representar produto físico, alimento preparado, serviço agendável, ingresso de evento, classificado, encomenda ou outra categoria aprovada. O núcleo compartilha identidade, tenant, unidade, título, descrição, mídia, categorias, canais, status, visibilidade, preço, impostos quando aplicável e políticas. Cada especialização adiciona comportamento próprio por capacidade, não por centenas de campos nulos na mesma tabela.

Diferencie rigorosamente variante, opção, adicional, composição e observação. Uma variante identifica uma unidade comercial ou SKU distinta e normalmente participa de preço, estoque e mídia. Tamanho e cor de tênis ou roupa são variantes porque “Tênis preto, 41” pode ter SKU e estoque próprios. Uma opção ou modificador personaliza a linha do pedido sem necessariamente criar novo SKU. Ponto da carne, kit de guardanapo, tipo de embalagem e escolha de molho são opções. Um adicional altera preço e possivelmente estoque, como queijo extra. Uma composição ou ficha técnica consome insumos internos quando o item é produzido. Uma observação livre é texto excepcional e deve ser habilitada por política; ela não substitui escolhas estruturadas que precisam ser produzidas, precificadas ou medidas.

Essa separação precisa aparecer no cadastro. O lojista escolhe o tipo de oferta ou um blueprint de nicho. O blueprint não cria um sistema paralelo: ele apenas configura campos, capabilities, textos e defaults. Moda ativa variantes por atributos e grade. Alimentação ativa preparo, grupos de opções, ficha técnica e restrições alimentares. Beleza ativa duração, profissionais, recursos, buffers, sessões e consumo de insumos. Eventos ativam lotes, ingressos, capacidade, aprovação e check-in. Classificados ativam condição, localização aproximada, expiração, chat e moderação, sem forçar carrinho. O Admin Master pode versionar blueprints, mas um tenant não recebe capabilities que não contratou ou não configurou.

Grupos de opções, adicionais e especificações

Modele grupos reutilizáveis e vinculáveis a muitas ofertas. Um grupo possui nome interno, nome público, instrução, tipo de seleção, obrigatoriedade, mínimo total, máximo total, ordem, disponibilidade, canais e política de repetição. Cada opção possui nome, descrição, preço incremental ou preço de substituição, quantidade mínima e máxima por opção, unidade de incremento, estado, disponibilidade temporal, mídia opcional, SKU ou insumo relacionado quando houver e regras condicionais.

O tipo de seleção não deve ser codificado como “ingrediente” ou “carne”. Ele descreve a lógica: escolha única obrigatória, escolha única opcional, múltipla escolha, quantidade por opção, remoção de componentes padrão, texto controlado ou confirmação booleana. A interface deriva o controle correto: radio para exatamente uma, checkbox para múltiplas sem repetição, stepper para quantidades, toggle para sim ou não. Min e max são validados no cliente e no servidor. A soma de quantidades deve respeitar o limite do grupo. Uma opção pode ter quantidade máxima própria mesmo quando o grupo aceita mais itens.

Permita uma franquia incluída no preço. Um hambúrguer pode incluir um queijo e cobrar apenas o excedente; uma pizza pode incluir dois sabores; um serviço pode incluir um retorno; um ingresso pode incluir um acompanhante. O motor de preço deve calcular de forma determinística preço base, variante, opções, quantidades, inclusões, promoções, taxa, frete e impostos, sempre com decomposição legível. O pedido salva um snapshot imutável de nomes, preços, regras e escolhas para que uma edição futura do catálogo não reescreva vendas antigas.

As dependências precisam ser declarativas. “Se escolheu carne bovina, perguntar ponto” é condição de visibilidade. “Se escolheu tamanho grande, permitir borda” é condição de elegibilidade. Evite callbacks espalhados na UI. Use regras versionadas, detecte ciclos e limite profundidade de encadeamento para preservar legibilidade e cálculo. O comerciante pode criar muitos grupos e reutilizá-los, mas nesting infinito não é uma feature: é um risco de ciclos, preço incorreto e checkout impossível. O preview deve permitir testar o produto como cliente e bloquear a publicação quando houver regra impossível, grupo obrigatório sem opções, mínimos maiores que máximos ou combinações sem preço válido.

Na tela de catálogo, categorias são seções expansíveis. Itens mostram mídia, nome, resumo, status, canais, estoque, preço inicial e ações. Variantes podem expandir dentro do item. Grupos de opções aparecem como subestrutura vinculada e indicam quantas ofertas os utilizam. A edição rápida suporta teclado, Enter, Escape, Tab, copiar e colar quando seguro, validação de servidor e undo apenas quando semanticamente possível. Alterações em massa possuem prévia de impacto, especialmente quando modificam preço, disponibilidade ou muitos vínculos.

Página completa de cadastro e preview fiel

A página de edição completa usa navegação por seções ou tabs estáveis. “Sobre” contém identidade, descrição, mídia, tipo e atributos. “Venda” contém preço, canais, estoque e impostos. “Opções” contém variantes, modificadores, adicionais e composição. “Disponibilidade” contém categorias, unidades, dias, horários, pausas e agendamento. “Operação” contém preparo, separação, recursos e impressão. O nome exato das seções deve respeitar o domínio e a arquitetura existente, mas o agrupamento precisa reduzir carga cognitiva.

No desktop, o formulário ocupa a área principal e o truthful preview permanece em coluna lateral ou drawer acionável. No mobile, a prévia abre em sheet ou página. Ela usa exatamente o renderer da superfície pública com estado de rascunho. Não mostra nota, promoção, entrega, imagem, estoque ou texto que não existam. Mudanças ainda não salvas podem aparecer com indicação clara de prévia local. A publicação executa validação completa de domínio e retorna erros navegáveis até a seção responsável.

Agenda universal e vertical de beleza

A agenda não é apenas um calendário. Ela coordena cliente, serviço, profissional, unidade, sala, equipamento, duração, buffers, disponibilidade, recorrência, pagamento, comunicação e comparecimento. O núcleo deve suportar recursos agendáveis sem presumir que todo recurso é pessoa. Um atendimento pode exigir profissional e sala; outro pode exigir duas pessoas simultaneamente; um equipamento pode ter capacidade compartilhada. Disponibilidade resulta da interseção de horário da unidade, escala do profissional, bloqueios, férias, recursos, duração e políticas do serviço.

O cadastro de serviço deve conter duração padrão, variações de duração autorizadas, intervalo antes e depois, preço, profissionais elegíveis, recursos necessários, capacidade, política de cancelamento, antecedência mínima e máxima, sinal, instruções, recorrência, consumo de materiais e possibilidade de encaixe. Serviços encadeados precisam formar uma reserva coerente. Não permita overbooking silencioso. Quando o negócio autorizar overbooking, registre a política, limite, responsável e risco.

O fluxo do cliente começa no perfil ou link público. Ele escolhe serviço, unidade quando houver, profissional específico ou “qualquer disponível”, data e horário. O sistema pode inverter serviço e profissional conforme o nicho, mas deve manter as restrições. Antes de confirmar, mostra duração, preço, sinal, política e dados necessários. Depois registra pagamento real quando exigido, envia confirmação, cria lembretes, permite reagendar ou cancelar conforme política e oferece lista de espera quando não houver vaga.

O fluxo operacional trabalha com estados como solicitado, aguardando aprovação, aguardando sinal, confirmado, check-in realizado, em atendimento, concluído, ausência, cancelado e reembolsado. Transições possuem ator, horário, motivo e efeitos financeiros. O atraso do cliente pode reduzir, remarcar ou cancelar conforme regra. A duração real do atendimento é medida separadamente da duração planejada. Relatórios comparam atraso de início, tempo real, ocupação, no-show, retorno, ticket e rentabilidade sem culpar automaticamente o profissional por atrasos causados por agenda, recurso ou cliente.

Para beleza e bem-estar, acrescente histórico do cliente, preferências, alergias ou observações sensíveis com controle de acesso e base legal, prontuário quando o nicho exigir, termos e anexos, pacotes de sessões, consumo de créditos, recorrência, assinatura, comissões, split quando houver provedor real, venda de produto, consumo de insumo e retorno recomendado. Pacote é uma compra de créditos com vigência e regras; assinatura é cobrança recorrente com ciclo, inadimplência, suspensão e renovação. Não confunda as duas. A conclusão do serviço gera comanda, baixa materiais, calcula comissão segundo regra versionada e prepara checkout. Ajustes manuais exigem permissão e auditoria.

Perfil público, descoberta e detalhes

Perfis pessoais e comerciais compartilham identidade, mas não a mesma página. O perfil pessoal enfatiza pessoa, bio, links, publicações, portfólio, agenda pública e relações autorizadas. O perfil comercial enfatiza capa, logo, estado aberto, categoria, localização, horários, avaliação, ações, catálogo, serviços, eventos, políticas e formas de atendimento. Tabs vazias não devem aparecer. O que existe é derivado de capabilities ativas e conteúdo real.

Detalhes de produto, serviço, evento e classificado devem usar a anatomia aprendida com a Mobg. A mídia abre a experiência; status e categoria resumem contexto; título, autor ou loja e localização aparecem cedo; atributos importantes são escaneáveis; descrição e informações aprofundam; preço e ação principal ficam em painel de conversão. Produto oferece comprar ou escolher opções. Serviço oferece agendar. Evento oferece inscrição ou ingresso. Classificado oferece conversar ou propor. Não force todos ao mesmo CTA.

A busca é federada, mas os resultados preservam tipo. Pessoas, lojas, produtos, serviços, eventos, posts e classificados podem aparecer juntos com agrupamento e filtros. Geolocalização só é usada depois de consentimento e deve funcionar sem ela. Filtros incluem categoria, distância, data, preço, disponibilidade, aberto agora e atributos relevantes por tipo. O mapa aparece somente quando agrega decisão.

Feed e estúdio de apresentação dos posts

O feed padrão deve ser limpo, rápido e previsível. Cada card mostra autor, contexto, data, conteúdo, mídia, vínculos e ações com hierarquia constante. O usuário reconhece imediatamente post, produto, serviço, evento, vaga ou classificado por label e CTA, não por uma estética caótica. Posts especiais podem usar um preset editorial, mas ocupam proporções controladas, respeitam redução de movimento e não quebram a rolagem.

O autor cria primeiro o conteúdo. Depois pode permanecer no padrão ou abrir “Escolher apresentação”. Essa galeria mostra famílias aprovadas com preview real do próprio conteúdo. Ao escolher “Vaga de emprego”, por exemplo, o sistema valida cargo, empresa, localização, modelo de trabalho, remuneração quando informada, prazo e CTA. Ao escolher “Evento”, valida data, local e inscrição. Ao escolher “Promoção”, valida preço e vigência. O preset não pode inventar o que falta; ele pede o dado ou omite o bloco.

O editor permite trocar template, formato e mídia, ajustar campos autorizados e escolher variações de cor compatíveis. Elementos estruturais importantes podem ficar bloqueados. O documento do preset é versionado, serializável e seguro. O preview e o export usam o mesmo renderer determinístico. Exportações pesadas rodam em job com progresso, retry, erro e histórico. O feed pode renderizar uma versão responsiva sem depender da imagem exportada. Métricas distinguem alcance do conteúdo e uso do preset para avaliar se a apresentação melhora a atenção sem prejudicar conversão.

Carrinho e checkout orientados por capacidades

O carrinho não pode misturar silenciosamente itens incompatíveis. Defina política para um ou vários vendedores, modalidades de fulfillment, moeda, unidade e agenda. Se a primeira versão suportar apenas um estabelecimento por pedido, deixe isso explícito e impeça a mistura antes do checkout. Cada linha preserva variante, opções, quantidades, observação permitida, preço calculado e disponibilidade. Alterações do catálogo geram revalidação clara antes do pagamento.

O checkout revela somente métodos reais. Primeiro identifica ou confirma cliente; depois modalidade de atendimento; depois endereço, retirada, mesa, horário ou agenda conforme o caso; em seguida revisa itens, descontos, taxas, gorjeta quando aplicável, pagamento e consentimentos. A ordem pode mudar para reduzir trabalho desperdiçado, mas a confirmação final sempre apresenta total decomposto, prazo, política e destinatário.

Entrega, retirada, consumo local, envio por transportadora, atendimento presencial, atendimento online e ingresso são fulfillment capabilities distintas. Uma loja ativa apenas as que consegue cumprir. Retirada pede ponto, janela, instruções e responsável. Delivery pede área, endereço validado, taxa, previsão e contato. Serviço pede slot e recursos. Evento pede participante e ticket. Produto enviado pede cotação e prazo do provedor. O frontend deriva o fluxo dessas capacidades, não de condicionais por nicho espalhadas.

Pagamentos devem possuir intenção, autorização, captura, falha, expiração, cancelamento, estorno parcial ou total e conciliação conforme o provedor. Webhooks são assinados, deduplicados e tratados de forma idempotente. Nunca marque um pedido como pago apenas porque o navegador voltou de uma página externa.

Configuração de funcionamento, preparo e promessa

Horários de operação devem ser configurados por unidade e por modalidade. O editor semanal mostra lista textual e grade visual, suporta múltiplos intervalos por dia, pausas, feriados, exceções e cópia entre dias. Horário de loja aberta não é o mesmo que horário de delivery, retirada, agenda ou produção. Mudanças futuras podem ser agendadas e versionadas.

O tempo prometido ao cliente não é um campo estático. Crie um promise engine que combine tempo base da unidade, tempo do item ou serviço, fila atual, capacidade por estação ou recurso, quantidade, modalidade, distância e margem operacional. Comece com regras explicáveis e mensuráveis. Não invente IA antes de haver dados. Registre previsão no momento do pedido e tempos reais de confirmação, início, pronto, coleta e conclusão. Relatórios mostram erro da previsão, percentis e gargalos.

Para alimentação, o tempo de preparo pode ser o maior tempo paralelo entre itens, a soma por estação ou outra regra configurada e validada. Ficha técnica relaciona produto e insumos para custo e estoque. Estações como cozinha, bar ou expedição recebem apenas o que precisam. Para comércio, separação mede picking, conferência e embalagem. Para beleza, o tempo de atendimento e buffer ocupam agenda. O modelo compartilha eventos de operação, mas não força o mesmo cálculo.

Gestor de pedidos, KDS e expedição

Crie uma aplicação web full-screen, responsiva e instalável para operação contínua. Ela é uma superfície nativa do produto, não um iframe decorativo. O shell é mínimo, os textos são grandes o suficiente para distância operacional e os estados são distinguíveis sem depender apenas de cor. O operador seleciona uma ou várias unidades conforme permissão, vê saúde de conexão, impressão e canais e recebe alerta sonoro e visual configurável para novos pedidos.

O fluxo canônico de pedido é uma máquina de estados. Um pedido pode nascer pendente de confirmação, ser confirmado, entrar em preparação ou separação, ficar pronto, aguardar coleta, ser coletado, seguir em rota e ser concluído. Retirada, consumo local, serviço e envio usam transições próprias. Cancelamento, rejeição, falha de pagamento, item indisponível, substituição, atraso, devolução e disputa são ramos explícitos. A UI nunca movimenta o cartão antes de a transição ser aceita pelo domínio; pode usar atualização otimista somente quando houver rollback confiável.

Ofereça três visualizações sobre o mesmo estado: kanban para acompanhamento, lista densa para busca e operação em lote e tela de produção por estação. Cards exibem número, tempo decorrido, promessa, canal, modalidade, itens resumidos, alertas e próxima ação. Ao abrir, o detalhe mostra itens e opções em hierarquia, observações, cliente minimizado, pagamento, entrega, timeline, impressão e ocorrências. Informação sensível aparece apenas para quem precisa.

O KDS agrupa itens por estação, permite iniciar e concluir produção, destaca alergias ou restrições declaradas sem inferir segurança e mede tempo. A expedição confere volumes, itens, lacre, identificação e entregador. Para varejo, o picking pode agregar quantidades por SKU e depois redistribuir por pedido, registrando quem separou, conferiu e embalou. Divergência de estoque aciona substituição, falta parcial ou cancelamento conforme política e autorização.

PDV e comanda

O PDV precisa ser rápido com mouse, teclado, toque e leitor de código quando configurado. A tela combina busca e categorias, grade/lista de ofertas e uma comanda persistente. O operador identifica cliente quando necessário, escolhe variante e opções, altera quantidade, registra observação permitida, aplica desconto autorizado, divide ou une comandas, define modalidade e recebe pagamento. Cada atalho precisa ser documentado e não conflitar com acessibilidade.

O caixa possui abertura, saldo inicial, suprimento, sangria, vendas, estornos, divergência e fechamento por operador e unidade. Desconto por item e geral obedece limites, motivos e permissões. Pagamento dividido só aparece com suporte real. Fiscalização, NFC-e ou NFS-e só aparece com integração válida. Operação offline só pode ser prometida quando existir armazenamento local seguro, fila de sincronização, resolução de conflitos, numeração e regras de pagamento compatíveis; caso contrário, ofereça estado degradado honesto.

Comandas servem mesa, cliente ou atendimento. Em beleza, recebem serviços realizados, profissionais, produtos e consumo de pacote. Em alimentação, recebem itens por rodada e mesa. O fechamento calcula descontos, taxas, crédito, fidelidade e pagamentos, gera comprovante e atualiza estoque, comissão e financeiro por transação atômica ou saga controlada.

Impressão confiável

Impressão em navegador exige estratégia explícita. Não considere window.print() suficiente para cozinha. Crie um serviço de impressão com filas, templates versionados, roteamento por estação, quantidade de vias, largura de papel, fallback PDF e reimpressão auditada. Quando acesso a impressora de rede ou USB exigir agente local, bridge nativa ou aplicação auxiliar, mostre instalação, pareamento, health check e permissões. A interface exibe desconectado, degradado, fila parada, erro e último teste.

Cada job possui idempotency key e spool persistente. Um pedido não pode imprimir duplicado por retry invisível. Reimpressão informa motivo e autor. Templates usam dados do snapshot do pedido e destacam opções, quantidades, observações e restrições. A ausência da impressora nunca bloqueia a confirmação silenciosamente; ela gera alerta operacional e oferece ação alternativa segura.

Entrega própria, rede de entregadores e Sob Demanda

Modele a JAH Entrega como domínio separado que pode atender pedidos originados na JAH e solicitações externas criadas por empresas. O fluxo Sob Demanda começa com origem, destino, contato mínimo, conteúdo permitido, volume, janela e instruções. O sistema verifica cobertura, calcula cotação com validade, mostra preço e previsão, recebe confirmação e pagamento ou cobrança contratual, cria a entrega e inicia alocação. Uma cotação expirada precisa ser recalculada; não reutilize preço antigo silenciosamente.

As configurações do estabelecimento suportam retirada, entrega própria, frota de parceiros, rede JAH e integrações externas. Áreas podem ser definidas por raio, bairro, CEP ou polígono, conforme fonte de geocodificação disponível. Regras incluem valor base, faixas, pedido mínimo, gratuidade, limite, horários, capacidade e zonas excluídas. O mapa é uma visualização da regra canônica, não a própria regra sem estrutura. Endereços devem ser validados, mas permitir correção assistida e ponto de referência.

O entregador possui onboarding, identidade e documentos conforme obrigação legal e modelo de negócio, veículo, áreas, disponibilidade, status online, limites, bloqueios, termos, dados bancários ou carteira e avaliações/ocorrências com direito de contestação. A aplicação mobile mostra oferta de corrida, origem aproximada antes da aceitação quando necessário à privacidade, valor, distância e estimativa. Depois de aceitar, libera dados mínimos, navegação, chegada, coleta, código ou prova e destino. Localização em tempo real requer consentimento, aviso e retenção limitada.

O dispatcher considera cobertura, distância até origem, veículo, capacidade, carga atual, prioridade, SLA e regras de justiça. Comece com matching determinístico e auditável. Batching de entregas só ocorre quando compatível com temperatura, prazo, capacidade e rota. O entregador pode recusar sem que a interface invente aceite. A empresa acompanha buscando, a caminho da coleta, chegou, coletado, em rota, chegou ao destino, entregue, falhou, retornando e devolvido. Ocorrências possuem motivo, evidência permitida, suporte e trilha.

Prova de entrega pode usar PIN, assinatura, foto ou geolocalização conforme política, base legal e risco; não colete tudo por padrão. Ganhos do entregador e custo da empresa são registros financeiros distintos. A conclusão operacional não significa automaticamente liquidação financeira. Repasses possuem período, ajustes, retenções, contestação e comprovante.

Financeiro e reconciliação

O painel financeiro começa com período e visão consolidada. Cards mostram vendas brutas, descontos, taxas, serviços, estornos, ajustes e total líquido com explicação acessível. Abaixo, tabelas de recebíveis e repasses mostram período de apuração, previsão, situação, valor e detalhes. O usuário consegue rastrear cada número até transações. Não use métricas sem definição.

Separe caixa operacional, contas a pagar/receber, ledger de pagamentos, comissões, repasses de marketplace, ganhos de entregadores e assinaturas. Eventos do domínio lançam movimentos, mas ajustes possuem origem e autor. Conciliação compara provedor, pedido, pagamento e repasse. Divergência vira ocorrência investigável. Relatórios respeitam competência e caixa quando aplicável e deixam claro qual visão está sendo usada.

Eventos

A criação de evento segue progressive disclosure. Primeiro, capa, nome, calendário/organização, início, fim, timezone, local ou link, descrição e visibilidade. O sistema salva um rascunho cedo e apresenta preview real. Em seguida, o organizador configura inscrição, ingressos, lotes, capacidade geral e por tipo, aprovação, lista de espera, perguntas, políticas, coorganizadores, check-in, comunicação e integrações.

Eventos gratuitos, pagos, privados, públicos, recorrentes, com múltiplas sessões ou híbridos têm contratos claros. Ingresso possui lote, período de venda, preço, capacidade, código, status e titular. Aprovação separa inscrição solicitada de ingresso confirmado. Pagamento e aprovação definem uma sequência explícita. Cancelamento de evento aciona comunicação e reembolso real quando aplicável. Check-in usa QR ou busca manual, funciona com permissão limitada para equipe e trata duplicidade, offline e sincronização.

CRM, clientes e comunicação

Uma pessoa possui identidade unificada no escopo permitido, sem fundir tenants. O perfil de cliente agrega contatos, consentimentos, histórico, compras, pedidos, agendamentos, eventos, mensagens, preferências e documentos autorizados. Duplicidade é detectada por sinais, mas fusão exige revisão e trilha. Campos sensíveis têm acesso restrito e retenção.

O CRM trabalha com pipeline configurável, oportunidades, responsáveis, atividades, tarefas, SLA, notas, anexos, produtos ou serviços de interesse, propostas e histórico. Arrastar um card executa uma transição de domínio validada, persiste, audita e recalcula indicadores. Mensagens de WhatsApp, e-mail, push ou chat só são enviadas por canal configurado e com consentimento e templates quando exigidos. Automação nunca finge envio.

Na beleza, o CRM identifica retorno previsto, clientes inativos, no-show, pacote próximo do fim e aniversário apenas conforme consentimento. Em comércio, identifica abandono, recompra e pós-venda. Em eventos, inscrição incompleta e comunicação com participantes. Segmentos são consultas salvas e explicáveis, não listas copiadas que envelhecem.

Onboarding orientado por tipo de operação

O onboarding deve começar com identidade e estrutura: usuário, organização, unidade, papel e objetivo. Em seguida, pergunta o que o negócio oferece e como atende. Essas respostas ativam uma trilha, não um fork. Um restaurante configura horários, catálogo preparado, opções, preparo, canais, impressão e fulfillment. Uma loja configura produtos, variantes, estoque, retirada e envio. Um profissional configura serviços, agenda, recursos e pagamento. Um organizador configura calendário e eventos. Um entregador percorre onboarding próprio.

Cada etapa salva progresso, mostra por que a informação é necessária, permite sair e retomar e valida integrações. O checklist de ativação é derivado de capacidades reais: uma loja só pode abrir quando possui identidade, oferta publicada, horário e ao menos uma forma funcional de atendimento e pagamento quando exigido. O usuário pode explorar o painel antes de publicar, mas a interface distingue configuração de operação ativa.

Admin Master, módulos e multi-tenancy

Admin Master administra plataforma, não o conteúdo cotidiano de cada tenant. Ele gerencia manifests de módulos, planos, entitlements, blueprints, presets de post, design tokens aprovados, integrações, limites, moderação, suporte e saúde. Impersonation, quando existir, exige motivo, banner visível, prazo e auditoria. O administrador do tenant controla organização, unidades, usuários, papéis, catálogo e operação dentro de seus limites.

Tenant isolation precisa existir no backend, banco, storage, cache, busca, realtime, jobs, webhooks e logs. Nunca confie em tenant_id vindo do frontend. Derive o escopo da sessão e membership autorizada. Use RLS quando compatível, proteção contra IDOR, políticas por registro e testes de isolamento. Service accounts possuem escopos mínimos. Desabilitar módulo não apaga dados nem deixa rotas quebradas. Dependências de módulo são validadas antes da ativação.

APIs, integrações, webhooks e eventos

O sistema deve possuir serviços de domínio canônicos usados por interface, API e futuras ferramentas de IA. Não duplique regra no frontend nem em conector. Documente contratos reais com autenticação, autorização, tenant scope, schemas versionados, paginação, filtros, idempotência, rate limit, erros, side effects e eventos.

Integrações de catálogo seguem mapeamento explícito entre IDs internos e externos, canais, preços, disponibilidade e variantes. Integrações de pedido recebem eventos em tempo real por webhook quando disponível, validam assinatura, persistem inbox, deduplicam e processam idempotentemente. Quando polling for necessário, use cursor, frequência permitida, acknowledgment e recuperação. Eventos podem chegar repetidos ou fora de ordem; a máquina de estados deve rejeitar regressões inválidas e permitir reconciliação.

Use transactional outbox para publicar eventos depois da transação local e inbox para consumidores externos. Cada webhook possui assinatura, timestamp, proteção contra replay, retry com backoff, dead letter, replay autorizado e logs redigidos. O painel de integrações mostra not_configured, incomplete, validating, active, degraded, revoked ou disabled. Uma capability só aparece ao cliente quando o estado e a configuração realmente a suportam.

Ao avaliar integração com iFood, considere separadamente Merchant, Catalog, Order, Events, Shipping e Logistics. O catálogo externo organiza categorias, itens, produtos, grupos de opções e opções; pedidos incluem itens e escolhas; eventos dirigem o lifecycle; logística possui disponibilidade, cotação, alocação, acompanhamento e conclusão. Não copie a API nem seus prazos como regra interna universal. Crie adapters e traduza estados para o domínio JAH sem perder o payload original necessário à auditoria.

Ao avaliar Nuvemshop ou outro e-commerce, preserve produtos, variações, estoque por local, pedidos e webhooks. Ao avaliar Sympla ou Luma, preserve eventos, participantes, ingressos e check-in. Ao avaliar pagamentos, confirme autorização, captura, split, recorrência, estorno e conciliação do provedor. Nenhuma integração deve ser marcada pronta apenas porque existe um formulário de credenciais.

Aprendizados das plataformas pesquisadas

iFood contribui com catálogo hierárquico, edição rápida em grid, página completa com preview fiel, grupos de complementos, disponibilidade, gestor de pedidos, impressão, expedição, entrega e chamada de entregador para pedidos externos. A documentação pública confirma separação entre Catalog, Orders, Events, Shipping e Logistics, uso de OAuth, eventos por webhook ou polling, confirmação de pedidos com SLA e fluxos de cotação e criação de entrega. Use essa maturidade como referência de domínio e confiabilidade.

Belasis, Avec e Trinks demonstram que agenda profissional não funciona isolada. Ela se conecta a clientes, lembretes, pacotes, assinaturas, comissões, caixa, pagamentos, estoque, consumo de insumos, prontuário, franquias e relatórios. Avec reforça custo fracionado de insumos, split e app do profissional. Trinks reforça comandas, pacotes versus assinatura, fidelidade em rede, transferência de estoque e pedidos de compra. Belasis reforça agendamento online, confirmação, CRM, pagamentos, recorrência, sinal e API. Não copie telas desconhecidas; incorpore capacidades comprovadas em contratos próprios.

Goomer, Anota AI, Consumer e Saipos demonstram a convergência entre cardápio digital, WhatsApp, QR code, PDV, KDS, estoque, ficha técnica, impressão, mesas, comandas, fiscal e relatórios. A JAH deve centralizar canais no mesmo pedido, sem redigitação, mas cada integração precisa ter health check e reconciliação. Nuvemshop demonstra produtos, variações, multiestoque e pedidos orientados por webhooks. Seu Nimbus é uma referência aberta de design system com tokens, componentes, patterns, templates, temas e sincronização entre Figma e React; use a ideia de sistema canônico, não necessariamente sua aparência ou código sem verificar licença e compatibilidade.

Neutto contribui com aquisição e cadastros enxutos. Mobg contribui com página de detalhe, galeria, decomposição de preço, CTA lateral e agendamento/proposta. Luma contribui com criação simples, preview, capacidade, aprovação, ingressos e gestão posterior. MUI, Atlassian, Carbon e Primer confirmam os padrões de data grid bidimensional, edição de célula e linha, inline edit, expansão, painel lateral e página dedicada. Esses nomes devem ser usados na documentação da JAH para que design e engenharia falem a mesma língua.

A marca citada como “88Beauty” não apresentou documentação pública inequívoca durante a pesquisa. Não invente features atribuídas a ela. Se o proprietário fornecer URL, acesso ou capturas corretas, faça uma análise separada e adicione apenas evidências verificáveis.

Arquitetura de dados e estados

Antes de criar tabelas, confronte este modelo conceitual com o schema real. Preserve uma identidade global de usuário separada de memberships e papéis. Organizações contêm unidades e módulos. Perfis públicos podem pertencer a usuários ou organizações conforme regra. Ofertas se especializam por capability. Catálogo organiza categorias, coleções, variantes, opções, preços e disponibilidade. Carrinho é transitório e pedido é snapshot. Fulfillment coordena retirada, delivery, envio, agenda ou consumo local. Pagamento e financeiro possuem ledgers próprios. Publicação possui conteúdo e apresentação separados. Agenda coordena booking e recursos. Entrega coordena job e courier. Não colapse tudo em orders nem multiplique tabelas quase idênticas por nicho.

Cada agregado possui state machine documentada. Transições acontecem em application services, dentro de transação ou saga. Registre actor_id, origem, timestamp, versão e correlation ID. Use optimistic concurrency onde dois operadores possam editar o mesmo objeto. Soft delete não substitui política de retenção. Eventos antigos e snapshots necessários a pedido, pagamento, contrato, ingresso ou auditoria não podem ser reescritos por atualização de cadastro.

Segurança, privacidade e abuso

Mapeie PII, dados sensíveis, localização, saúde, documentos, pagamento e conteúdo de chat. Colete o mínimo, explique finalidade, limite retenção e controle exportação e exclusão. Uploads passam por tipo, tamanho, assinatura real do arquivo, malware quando aplicável, autorização, bucket correto e URL temporária. Localização de cliente e entregador não aparece para papéis que não precisam.

Proteja cadastro, login, recuperação, convites, checkout, cupons, avaliações, chat, criação de entrega, webhooks e APIs contra abuso, enumeração, fraude, replay, spam e rate abuse. Moderação conecta denúncia a entidade, autor, motivo, evidência, decisão, recurso e auditoria. Ações destrutivas ou financeiras exigem confirmação proporcional, permissão e, quando necessário, reautenticação.

Observabilidade, métricas e verdade operacional

Instrumente fluxos, não apenas page views. Meça criação e publicação de oferta, erro de validação, abandono de checkout, pagamento, confirmação, preparo, promessa, atraso, coleta, entrega, agendamento, no-show, check-in, uso de preset e falha de integração. Métricas operacionais precisam de definição, janela e fonte. Logs usam correlation ID e redaction. Jobs mostram fila, duração, retries e falha. Alertas distinguem incidente técnico de pico de negócio.

Crie dashboards para saúde do sistema e relatórios para decisão do tenant, sem misturar os dois. Um restaurante vê tempo por estação e erro da promessa; uma loja vê separação, ruptura e entrega; beleza vê ocupação, duração real, retorno e no-show; eventos veem conversão, capacidade e check-in; a plataforma vê disponibilidade, isolamento, erros, latência e custo.

Estratégia de implementação sem big bang

Depois da auditoria, proponha um roadmap por dependência e fatias verticais. A primeira mudança deve estabilizar o design system e migrar uma tela-piloto real sem alterar sua regra de negócio. A tela ideal combina lista, formulário, estados e responsividade; catálogo pode ser escolhido somente se a base estiver suficientemente compreendida. A migração deve provar tokens, shell, componentes, acessibilidade, loading, vazio, erro e persistência.

Em seguida, consolide o padrão de edição em profundidades. Depois modele oferta, variante e grupos de opções em compatibilidade com o catálogo atual. Entregue um fluxo vertical completo para um nicho, com cadastro, preview, publicação, compra e pedido, antes de ativar outro. A agenda segue o mesmo princípio com um serviço completo. Gestor de pedidos, impressão, entrega e financeiro entram sobre eventos e estados já estabilizados. O estúdio de apresentação de posts pode evoluir em paralelo apenas depois que conteúdo canônico e renderer padrão estiverem definidos.

Cada microfase deve descrever em prosa seu objetivo observável, evidência no código, dependências, escopo, exclusões, papéis, telas, dados, APIs, estados, segurança, acessibilidade, telemetria, testes, rollout e rollback. Não entregue uma checklist vazia. Conte a história operacional da mudança: quem entra, o que vê, o que faz, o que persiste, quais eventos surgem, o que acontece quando falha e como se comprova que terminou.

Use migrations aditivas quando possível, feature flags por capability, adapters temporários e backfills observáveis. Nenhuma migração irreversível sem backup e plano de retorno. Nenhuma remoção antes de confirmar consumidores. Nenhum rollout global antes de tenant piloto e métricas. Não prometa prazo fictício; estime complexidade e risco relativos.

Storyboard obrigatório de entrega da auditoria

Sua primeira resposta ao proprietário deve ser um dossiê narrativo. Comece confirmando o projeto e explicando as evidências. Conte como a aplicação inicia, autentica, descobre tenant, monta navegação e acessa dados. Caminhe pelas rotas reais como cada papel caminharia. Em cada página, explique intenção, componentes, dados, ações, estados, conflitos e lacunas. Mostre onde o design system é canônico e onde há estilos paralelos.

Depois narre a jornada do comerciante que entra, configura unidade, cria uma oferta, escolhe variantes ou opções, verifica preview, publica, recebe pedido, prepara, imprime, chama entregador, acompanha, conclui e confere o financeiro. Narre a jornada do cliente correspondente. Faça o mesmo para o profissional de serviços e seu cliente, para o organizador e participante de evento, para quem publica uma vaga ou flyer e para o entregador. Onde o código não suportar a história, marque a quebra com evidência. Onde houver apenas mock, diga explicitamente.

Finalize propondo a arquitetura-alvo em comparação com a atual, o mapa de consolidação, os riscos e um roadmap. Detalhe apenas a primeira microfase pronta para execução e não implemente as seguintes automaticamente. Perguntas só podem permanecer quando o repositório, a configuração ou uma decisão comercial realmente não responderem.

Critério de pronto

Uma página não está pronta porque renderiza. Ela está pronta quando possui entrada de navegação, autorização, dados reais, validação, persistência, estados, erros, auditoria quando necessária, responsividade, acessibilidade, testes e documentação. Uma integração não está pronta porque autentica; precisa sincronizar, deduplicar, reconciliar e falhar de forma visível. Um pedido não está pronto porque aparece em kanban; precisa transicionar de verdade e refletir estoque, pagamento, operação e fulfillment. Um preview não está pronto se inventa conteúdo. Um preset não está pronto se sacrifica leitura. Uma entrega não está pronta se apenas move um ícone no mapa. Um financeiro não está pronto se o total não pode ser rastreado.

O resultado final deve ser uma plataforma limpa e coerente, capaz de servir múltiplos nichos sem virar um conjunto de sistemas desconectados. A JAH se diferencia não por impor uma interface underground a todos, mas por oferecer uma operação séria e silenciosa e, no momento da publicação, permitir que pessoas e negócios deem uma cara marcante ao conteúdo sem perder estrutura, verdade ou acessibilidade.

Referências verificadas para esta evolução

A pesquisa que fundamenta este documento consultou a documentação pública do iFood Developer para Merchant, Catalog, Orders, Events, Shipping e Logistics; as páginas e centrais oficiais de Belasis, Avec e Trinks; as páginas oficiais de Goomer, Anota AI, Consumer e Saipos; a documentação de integração e o design system Nimbus da Nuvemshop; a API pública da Sympla; a central e API da Luma; as páginas públicas da Neutto e Mobg; e as documentações de padrões de edição do MUI Data Grid, Atlassian Design System, Carbon Design System e Primer. Essas referências servem para comparação de conceitos. Antes de usar bibliotecas, código, assets ou integrações, verifique licença, termos, contrato comercial, versão da API e compatibilidade com a stack real.

